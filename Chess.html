<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Game</title>

<!-- Chess rules library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    font-family: Arial, sans-serif;
    background: #10131b;
    color: white;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

h1 {
    margin: 5px 0;
    font-size: 30px;
}

.subtitle {
    color: #aeb7c8;
    margin: 8px 0 20px;
}

.controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
}

select, button {
    border: none;
    border-radius: 9px;
    padding: 11px 12px;
    font-size: 14px;
}

select {
    flex: 1;
    background: #252b39;
    color: white;
    min-width: 0;
}

button {
    cursor: pointer;
    background: #5965f2;
    color: white;
    font-weight: bold;
}

button:active {
    transform: scale(.97);
}

#status {
    background: #202635;
    border: 1px solid #343c50;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-weight: bold;
    min-height: 45px;
}

#board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: 100%;
    aspect-ratio: 1;
    border: 4px solid #303747;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 10px 35px #0006;
}

.square {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0;
    border-radius: 0;
    font-family: "Arial Unicode MS", "DejaVu Sans", sans-serif;
    font-size: clamp(25px, 8vw, 43px);
    line-height: 1;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.light {
    background: #e9e2d0;
}

.dark {
    background: #78936b;
}

.square.selected {
    background: #e9d34e;
}

.square.legal::after {
    content: "";
    position: absolute;
    width: 23%;
    height: 23%;
    background: #17271970;
    border-radius: 50%;
}

.square.capture::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 4px solid #d94b4b;
    border-radius: 50%;
}

.white-piece {
    color: #fff;
    text-shadow:
        -1px -1px 1px #333,
        1px -1px 1px #333,
        -1px 1px 1px #333,
        1px 1px 1px #333,
        0 3px 2px #333;
}

.black-piece {
    color: #171717;
    text-shadow: 0 1px 1px #ffffff80;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}

.buttons button {
    flex: 1;
}

#undo {
    background: #343d50;
}

#newGame {
    background: #178c68;
}

.info {
    color: #aeb7c8;
    font-size: 12px;
    margin: 15px 0;
    line-height: 1.6;
}

.history-box {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #202635;
    text-align: left;
}

.history-box h3 {
    margin: 0 0 10px;
    font-size: 15px;
}

#history {
    font-size: 13px;
    color: #cbd2df;
    line-height: 1.8;
    max-height: 120px;
    overflow-y: auto;
    overflow-wrap: anywhere;
}

@media (max-width: 360px) {
    body {
        padding: 12px 7px;
    }

    .square {
        font-size: 25px;
    }

    select, button {
        padding: 10px 7px;
        font-size: 12px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>♟ Chess</h1>
    <p class="subtitle">Challenge yourself or play with a friend</p>

    <div class="controls">
        <select id="mode">
            <option value="computer">🤖 Computer vs Human</option>
            <option value="human">👥 Two Players</option>
        </select>

        <select id="color">
            <option value="w">Play as White</option>
            <option value="b">Play as Black</option>
        </select>
    </div>

    <div id="status">White to move</div>

    <div id="board"></div>

    <div class="buttons">
        <button id="undo">↩ Undo</button>
        <button id="newGame">🔄 New Game</button>
    </div>

    <div class="history-box">
        <h3>📜 Move History</h3>
        <div id="history">No moves yet.</div>
    </div>

    <p class="info">
        Computer mode uses a basic chess AI.<br>
        Internet is required to load the chess rules library.
    </p>

</div>

<script>
const game = new Chess();

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const historyElement = document.getElementById("history");
const modeElement = document.getElementById("mode");
const colorElement = document.getElementById("color");

let selectedSquare = null;
let legalMoves = [];
let thinking = false;
let gameVersion = 0;

const pieceSymbols = {
    wk: "♔",
    wq: "♕",
    wr: "♖",
    wb: "♗",
    wn: "♘",
    wp: "♙",
    bk: "♚",
    bq: "♛",
    br: "♜",
    bb: "♝",
    bn: "♞",
    bp: "♟"
};

const pieceValues = {
    p: 100,
    n: 320,
    b: 330,
    r: 500,
    q: 900,
    k: 20000
};

function humanColor() {
    return colorElement.value;
}

function computerMode() {
    return modeElement.value === "computer";
}

function isHumanTurn() {
    return !computerMode() || game.turn() === humanColor();
}

function renderBoard() {
    boardElement.innerHTML = "";

    const files = "abcdefgh";
    const ranks = "87654321";

    const flipped = computerMode() && humanColor() === "b";

    const squares = [];

    if (flipped) {
        for (let r = 0; r < 8; r++) {
            for (let f = 7; f >= 0; f--) {
                squares.push(files[f] + ranks[r]);
            }
        }
    } else {
        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                squares.push(files[f] + ranks[r]);
            }
        }
    }

    squares.forEach(square => {
        const file = square.charCodeAt(0) - 97;
        const rank = Number(square[1]);

        const button = document.createElement("button");
        button.className = "square " +
            ((file + rank) % 2 === 0 ? "light" : "dark");

        button.dataset.square = square;
        button.setAttribute("aria-label", square);

        if (selectedSquare === square) {
            button.classList.add("selected");
        }

        const moveTarget = legalMoves.find(m => m.to === square);

        if (moveTarget) {
            if (game.get(square)) {
                button.classList.add("capture");
            } else {
                button.classList.add("legal");
            }
        }

        const piece = game.get(square);

        if (piece) {
            const key = piece.color + piece.type;
            button.textContent = pieceSymbols[key];

            button.classList.add(
                piece.color === "w" ? "white-piece" : "black-piece"
            );
        }

        button.addEventListener("click", () => onSquareClick(square));

        boardElement.appendChild(button);
    });

    updateStatus();
    updateHistory();
}

function updateStatus() {
    if (game.in_checkmate()) {
        statusElement.textContent =
            "Checkmate! " +
            (game.turn() === "w" ? "Black" : "White") +
            " wins!";
        return;
    }

    if (game.in_draw()) {
        statusElement.textContent = "Game drawn!";
        return;
    }

    if (game.in_stalemate()) {
        statusElement.textContent = "Stalemate! Game drawn.";
        return;
    }

    const side = game.turn() === "w" ? "White" : "Black";

    let message = side + " to move";

    if (game.in_check()) {
        message += " — CHECK!";
    }

    if (thinking) {
        message = "🤖 Computer is thinking...";
    } else if (computerMode() && !isHumanTurn()) {
        message = "🤖 Computer's turn";
    }

    statusElement.textContent = message;
}

function updateHistory() {
    const history = game.history();

    if (!history.length) {
        historyElement.textContent = "No moves yet.";
        return;
    }

    let output = "";

    for (let i = 0; i < history.length; i += 2) {
        output +=
            (Math.floor(i / 2) + 1) + ". " +
            history[i] + " " +
            (history[i + 1] || "") + "<br>";
    }

    historyElement.innerHTML = output;
}

function onSquareClick(square) {
    if (game.game_over() || thinking || !isHumanTurn()) {
        return;
    }

    const piece = game.get(square);

    if (selectedSquare) {
        const possibleMove = legalMoves.find(m => m.to === square);

        if (possibleMove) {
            let promotion;

            if (possibleMove.promotion) {
                promotion = prompt(
                    "Promote pawn to: q (Queen), r (Rook), b (Bishop), n (Knight)",
                    "q"
                );

                promotion = (promotion || "q").toLowerCase();

                if (!["q", "r", "b", "n"].includes(promotion)) {
                    promotion = "q";
                }
            }

            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: promotion || "q"
            });

            selectedSquare = null;
            legalMoves = [];

            if (move) {
                renderBoard();
                maybeComputerMove();
                return;
            }
        }

        if (piece && piece.color === game.turn()) {
            selectSquare(square);
        } else {
            selectedSquare = null;
            legalMoves = [];
            renderBoard();
        }

        return;
    }

    if (piece && piece.color === game.turn()) {
        selectSquare(square);
    }
}

function selectSquare(square) {
    selectedSquare = square;

    legalMoves = game.moves({
        square: square,
        verbose: true
    });

    renderBoard();
}

// Evaluate the board from White's point of view.
function evaluateBoard() {
    let score = 0;

    const board = game.board();

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const piece = board[r][c];

            if (!piece) continue;

            let value = pieceValues[piece.type];

            // Small bonus for advancing pawns.
            if (piece.type === "p") {
                const advancement =
                    piece.color === "w" ? 6 - r : r - 1;

                value += advancement * 8;
            }

            // Encourage developing minor pieces.
            if (piece.type === "n" || piece.type === "b") {
                const centerBonus =
                    7 - (Math.abs(3.5 - c) + Math.abs(3.5 - r));

                value += centerBonus * 4;
            }

            score += piece.color === "w" ? value : -value;
        }
    }

    return score;
}

function minimax(depth, alpha, beta, maximizingWhite) {
    if (game.game_over() || depth === 0) {
        if (game.in_checkmate()) {
            return game.turn() === "w"
                ? -100000 - depth
                : 100000 + depth;
        }

        if (game.in_draw()) return 0;

        return evaluateBoard();
    }

    const moves = game.moves({ verbose: true });

    // Try captures and promotions first.
    moves.sort((a, b) => {
        const aScore =
            (a.captured ? pieceValues[a.captured] : 0) +
            (a.promotion ? pieceValues[a.promotion] : 0);

        const bScore =
            (b.captured ? pieceValues[b.captured] : 0) +
            (b.promotion ? pieceValues[b.promotion] : 0);

        return bScore - aScore;
    });

    if (maximizingWhite) {
        let best = -Infinity;

        for (const move of moves) {
            game.move({
                from: move.from,
                to: move.to,
                promotion: move.promotion || "q"
            });

            const score = minimax(
                depth - 1,
                alpha,
                beta,
                false
            );

            game.undo();

            best = Math.max(best, score);
            alpha = Math.max(alpha, best);

            if (beta <= alpha) break;
        }

        return best;
    } else {
        let best = Infinity;

        for (const move of moves) {
            game.move({
                from: move.from,
                to: move.to,
                promotion: move.promotion || "q"
            });

            const score = minimax(
                depth - 1,
                alpha,
                beta,
                true
            );

            game.undo();

            best = Math.min(best, score);
            beta = Math.min(beta, best);

            if (beta <= alpha) break;
        }

        return best;
    }
}

function findBestComputerMove() {
    const moves = game.moves({ verbose: true });

    if (!moves.length) return null;

    let bestMove = null;
    let bestScore = -Infinity;

    // Depth 2 keeps the basic AI reasonably quick on phones.
    const depth = 2;

    for (const move of moves) {
        game.move({
            from: move.from,
            to: move.to,
            promotion: move.promotion || "q"
        });

        const score = minimax(
            depth - 1,
            -Infinity,
            Infinity,
            game.turn() === "w"
        );

        game.undo();

        // Computer maximizes its own score.
        const computerScore =
            humanColor() === "w" ? -score : score;

        const jitter = Math.random() * 0.01;
        const finalScore = computerScore + jitter;

        if (finalScore > bestScore) {
            bestScore = finalScore;
            bestMove = move;
        }
    }

    return bestMove;
}

function maybeComputerMove() {
    if (!computerMode() || game.game_over() || isHumanTurn()) {
        return;
    }

    thinking = true;
    renderBoard();

    const currentVersion = gameVersion;

    // Give the browser time to display the thinking message.
    setTimeout(() => {
        if (currentVersion !== gameVersion ||
            game.game_over() ||
            isHumanTurn()) {
            thinking = false;
            renderBoard();
            return;
        }

        const bestMove = findBestComputerMove();

        if (bestMove) {
            game.move({
                from: bestMove.from,
                to: bestMove.to,
                promotion: bestMove.promotion || "q"
            });
        }

        thinking = false;
        selectedSquare = null;
        legalMoves = [];

        renderBoard();
    }, 100);
}

function startNewGame() {
    game.reset();
    gameVersion++;

    selectedSquare = null;
    legalMoves = [];
    thinking = false;

    renderBoard();
    maybeComputerMove();
}

document.getElementById("newGame").addEventListener("click", () => {
    startNewGame();
});

document.getElementById("undo").addEventListener("click", () => {
    if (thinking) return;

    if (computerMode()) {
        // Undo both the computer's move and the player's move.
        game.undo();
        if (game.history().length) {
            game.undo();
        }
    } else {
        game.undo();
    }

    selectedSquare = null;
    legalMoves = [];
    gameVersion++;

    renderBoard();
});

modeElement.addEventListener("change", () => {
    colorElement.disabled = !computerMode();
    startNewGame();
});

colorElement.addEventListener("change", startNewGame);

// Initialize game.
colorElement.disabled = false;
startNewGame();
</script>
</body>
</html>
